[project]
name = "acdh-id-reconciler"
version = "0.8.0"
description = "Python package to reconcile GND, GeoNames IDs via WikiData"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "acdh-arche-assets>=3.29.0",
    "requests>=2.34.2",
    "sparqlwrapper>=2.0.0",
]
authors = [
    { name = "Peter Andorfer", email = "peter.andorfer@oeaw.ac.at" },
    { name = "Daniel Elsner", email = "daniel.elsner@oeaw.ac.at" }
]
[project.urls]
Repository = "https://github.com/acdh-oeaw/acdh-id-reconciler.git"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.14.1",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]
